services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tracery-db
    environment:
      POSTGRES_USER: tracery
      POSTGRES_PASSWORD: tracery
      POSTGRES_DB: tracery
    ports:
      # host 5433 -> container 5432, so it never clashes with a local Postgres
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracery -d tracery"]
      interval: 5s
      timeout: 5s
      retries: 10
